name: Daily Digest

on:
  schedule:
    - cron: '0 5 * * *'  # 08:00 Istanbul time (UTC+3, no DST)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Pango (required by WeasyPrint for text/font rendering)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Fetch feeds, dedup, and build digest
        run: python -m src.main

      - name: Prune digests older than 30 days
        run: python -m src.prune --days 30

      - name: Record digest date
        id: digest_date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Commit updated state and digest output
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update digest for ${{ steps.digest_date.outputs.date }}"
          file_pattern: "state/*.json output/*"
