# Source configuration for beacon-digest.
#
# Add a new source: append an entry under its category's `sources` list.
# Add a new category: append a new block to `categories` with its own key,
# display_name, and sources list.
# The digest script reads this file at runtime and never hardcodes category
# or source names in code -- editing this file is the only step required.
#
# Fields per category:
#   key:          stable identifier, used internally (e.g. in dedup state)
#   display_name: human-readable label shown as the section heading
#   sources:      list of {name, feed_url}
#
# Fields per source:
#   name:     display name shown in the digest
#   feed_url: RSS/Atom feed URL (verified to return a parseable feed)

categories:
  - key: linux
    display_name: "Linux"
    sources:
      - name: "LWN.net"
        feed_url: "https://lwn.net/headlines/rss"
      - name: "Fedora Magazine"
        feed_url: "https://fedoramagazine.org/feed/"
      - name: "Red Hat Blog"
        feed_url: "https://www.redhat.com/en/rss/blog"
      - name: "Asahi Linux Blog"
        feed_url: "https://asahilinux.org/blog/index.xml"
      - name: "David Edmundson's Blog"
        feed_url: "https://blog.davidedmundson.co.uk/feed/"
      - name: "Mental Outlaw"
        feed_url: "https://www.youtube.com/feeds/videos.xml?channel_id=UC7YOGHUfC1Tb6E4pudI9STA"
      - name: "SavvyNik"
        feed_url: "https://www.youtube.com/feeds/videos.xml?channel_id=UC3yaWWA9FF9OBog5U9ml68A"

  - key: devops
    display_name: "DevOps"
    sources:
      - name: "CNCF Blog"
        feed_url: "https://www.cncf.io/feed/"
      - name: "Kubernetes Blog"
        feed_url: "https://kubernetes.io/feed.xml"
      - name: "HashiCorp Blog"
        feed_url: "https://www.hashicorp.com/blog/feed.xml"
      - name: "GitHub Blog"
        feed_url: "https://github.blog/feed/"
      - name: "The New Stack"
        feed_url: "https://thenewstack.io/feed/"

  - key: security
    display_name: "Security"
    sources:
      - name: "The Hacker News"
        feed_url: "https://feeds.feedburner.com/TheHackersNews"

  - key: ai
    display_name: "AI"
    sources:
      - name: "OpenAI Blog"
        feed_url: "https://openai.com/blog/rss.xml"
      - name: "Google DeepMind Blog"
        feed_url: "https://deepmind.google/blog/rss.xml"
      - name: "Hugging Face Blog"
        feed_url: "https://huggingface.co/blog/feed.xml"

  - key: general_tech
    display_name: "General Tech"
    sources:
      - name: "Hacker News (Top 20)"
        feed_url: "https://hnrss.org/frontpage?count=20"
